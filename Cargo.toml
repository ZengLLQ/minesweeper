[package]
name = "minesweeper"
version = "0.1.0"
edition = "2021"
description = "A modern, minimalist Minesweeper desktop game built with Rust and egui"
authors = ["Minesweeper Developer"]

[dependencies]
eframe = { version = "0.31", default-features = true }
egui = "0.31"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "6.0"
rodio = { version = "0.20", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
